name: Docker build
on: 
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

jobs:
  build-cli:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - version: "8.3"
            pkg: "83"
          - version: "8.4"
            pkg: "84"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Modify Dockerfile version
        run: |
          sed -i "s/php83/php${{ matrix.pkg }}/g;s/php84-json//g" cli/Dockerfile
          # On 3.23/3.24 PECL extensions are phpXX-pecl-* (json is built into
          # the core; apcu has no unsuffixed php84-apcu package)
          if [ "${{ matrix.version }}" = "8.4" ]; then
            sed -i "s/php84-apcu/php84-pecl-apcu/g" cli/Dockerfile
          fi
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: cli/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sentratek-id/alpine-php/cli:${{ matrix.version }}

  build-fpm:
    needs: build-cli
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - version: "8.3"
            pkg: "83"
          - version: "8.4"
            pkg: "84"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Modify Dockerfile version
        run: |
          sed -i "s/php83/php${{ matrix.pkg }}/g;s/php84-json//g" fpm/Dockerfile
          # Track the matrix version in the base image reference; a hardcoded
          # cli:8.3 made fpm:8.4 build FROM the wrong (8.3) base image
          sed -i "s|alpine-php/cli:8.3|alpine-php/cli:${{ matrix.version }}|" fpm/Dockerfile
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: fpm/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sentratek-id/alpine-php/fpm:${{ matrix.version }}

  build-octane:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - version: "8.3"
            pkg: "83"
          - version: "8.4"
            pkg: "84"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Modify Dockerfile version
        run: |
          sed -i "s/php83/php${{ matrix.pkg }}/g;s/php84-json//g" octane/Dockerfile
          # On 3.23/3.24 PECL extensions are phpXX-pecl-* (json is built into
          # the core; apcu/imap have no unsuffixed php84-* packages)
          if [ "${{ matrix.version }}" = "8.4" ]; then
            sed -i "s/php84-apcu/php84-pecl-apcu/g;s/php84-imap/php84-pecl-imap/g;s/pecl83/pecl84/g" octane/Dockerfile
          fi
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: octane/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sentratek-id/alpine-php/octane:${{ matrix.version }}

  build-nginx:
    needs: build-fpm
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - version: "8.3"
            pkg: "83"
          - version: "8.4"
            pkg: "84"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Modify Dockerfile version
        run: |
          sed -i "s/php83/php${{ matrix.pkg }}/g;s/php84-json//g" nginx/Dockerfile
          # Track the matrix version in the base image reference; a hardcoded
          # fpm:8.3 made nginx:8.4 build FROM the wrong (8.3) base image
          sed -i "s|alpine-php/fpm:8.3|alpine-php/fpm:${{ matrix.version }}|" nginx/Dockerfile
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: nginx/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sentratek-id/alpine-php/nginx:${{ matrix.version }}
