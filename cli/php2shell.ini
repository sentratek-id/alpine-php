; PHP2Shell hardening (CVE-2026-109619).
;
; The PHP 8.3.36 / 8.4.27 emergency fix stops the stale-state consumers
; only. The session.upload_progress producer stays enabled by default and
; writes attacker-controlled filenames into native session files even on
; patched PHP. PHP recommends disabling it permanently.
;
; ASTRO (2026-10-22): set at pool or php.ini level; app-level .user.ini
; files can still override this (setting is PHP_INI_ALL) - audit consumers.
session.upload_progress.enabled = 0
